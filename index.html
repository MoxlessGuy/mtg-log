async function saveDeck(){
  const ctx=sheetCtx, d=ctx.d, name=$('#df-name').value.trim();
  if(!name) return formErr('Give the deck a name.');
  let main=$('#df-main').value, side=$('#df-side').value;
  if(!norm(side)){ const lines=main.split(/\r?\n/), ix=lines.findIndex(l=>/^\s*sideboard\s*:?\s*$/i.test(l)); if(ix>=0){ side=lines.slice(ix+1).join('\n'); main=lines.slice(0,ix).join('\n'); } }
  main=norm(main); side=norm(side);
  const now=Date.now(); let versions=d&&Array.isArray(d.versions)?d.versions.slice():[]; let listAt=d?(d.listAt||d.createdAt||now):now;
  if(d&&(norm(d.main)!==main||norm(d.side)!==side)){ if(norm(d.main)||norm(d.side)){ versions.push({at:listAt,main:d.main||'',side:d.side||''}); if(versions.length>30) versions=versions.slice(-30); } listAt=now; }
  const data={name,format:$('#df-format').value,colors:COLORS.filter(c=>ctx.colors.includes(c)),main,side,notes:$('#df-notes').value.trim(),archived:d?!!($('#df-arch')&&$('#df-arch').checked):false,art:artValue(),versions,listAt,createdAt:d?(d.createdAt||now):now,updatedAt:now};
  if(d&&d.example) data.example=true;
  await save('decks',ctx.id||uid('d'),data);
  closeSheet(); toast(d?'Deck saved':'Deck created');
}

/* league */
function openLeague(){
  const decks=activeDecks();
  if(!decks.length){ toast('Create a deck first.','err'); openDeck(null); return; }
  const fd=(S.f.deck!=='all'&&deckById(S.f.deck))||decks[0];
  const html=`<form id="league-form" novalidate>
    ${sheetHead('New league')}
    <p class="hint">Usually not needed: logging a match with event “League” opens the league by itself.</p>
    <div class="field"><label for="lf-deck">Deck</label><select id="lf-deck">${decks.map(d=>`<option value="${esc(d.id)}"${d.id===fd.id?' selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="field"><label for="lf-format">Format</label><select id="lf-format">${formatOptions(fd.format||'Modern')}</select></div>
      <div class="field"><label for="lf-size">Matches in the league</label><input type="number" id="lf-size" min="1" max="20" value="5"></div>
    </div>
    <div class="field"><label for="lf-date">Started on</label><input type="date" id="lf-date" value="${today()}"></div>
    ${actions('')}
  </form>`;
  openSheet(html,{kind:'league'});
}
async function saveLeague(){
  const deckId=$('#lf-deck').value, d=deckById(deckId); if(!d) return formErr('Pick a deck.');
  const size=Math.min(20,Math.max(1,parseInt($('#lf-size').value,10)||5)), now=Date.now();
  await save('leagues',uid('l'),{deckId,deckName:d.name,format:$('#lf-format').value,size,startedAt:$('#lf-date').value||today(),status:'active',createdAt:now,updatedAt:now});
  closeSheet(); toast('League opened');
}

/* tournament */
function openTour(id){
  const t=id?tourById(id):null;
  if(id&&!t){ toast('This tournament no longer exists.','err'); return; }
  const decks=activeDecks(t&&t.deckId);
  if(!t&&!decks.length){ toast('Create a deck first.','err'); openDeck(null); return; }
  const deckId=t?t.deckId:((S.f.deck!=='all'&&deckById(S.f.deck))?S.f.deck:decks[0].id), d=deckById(deckId);
  const html=`<form id="tour-form" novalidate>
    ${sheetHead(t?'Tournament':'New tournament')}
    <div class="field"><label for="tf-name">Name</label><input type="text" id="tf-name" value="${esc(t?t.name:'')}" placeholder="e.g. Webcam 4, Saturday Main" autocomplete="off"></div>
    <div class="row2">
      <div class="field"><label for="tf-date">Date</label><input type="date" id="tf-date" value="${esc(t?(t.date||''):today())}"></div>
      <div class="field"><label for="tf-place">Placement <span class="opt">optional</span></label><input type="text" id="tf-place" value="${esc(t?t.placement:'')}" placeholder="e.g. 1st, Top8, Top16" autocomplete="off"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="tf-deck">Deck</label><select id="tf-deck">${deckOptions(deckId,t&&t.deckName)}</select></div>
      <div class="field"><label for="tf-format">Format</label><select id="tf-format">${formatOptions(t?t.format:((d&&d.format)||'Modern'))}</select></div>
    </div>
    <div class="field"><label for="tf-notes">Notes</label><textarea id="tf-notes" class="prose" rows="3">${esc(t?t.notes:'')}</textarea></div>
    ${actions(t?`<button type="button" class="btn danger" data-act="delete-tour" data-id="${esc(t.id)}" data-confirm data-confirm-label="Confirm delete">Delete</button>`:'')}
  </form>`;
  openSheet(html,{kind:'tour',id:t?t.id:null,t});
}
async function saveTour(){
  const ctx=sheetCtx, t=ctx.t, name=$('#tf-name').value.trim(); if(!name) return formErr('Give the tournament a name.');
  const deckId=$('#tf-deck').value, now=Date.now();
  const data={name,date:$('#tf-date').value||'',placement:$('#tf-place').value.trim(),deckId,deckName:deckLabel(deckId,t&&t.deckName),format:$('#tf-format').value,notes:$('#tf-notes').value.trim(),createdAt:t?(t.createdAt||now):now,updatedAt:now};
  if(t&&t.example) data.example=true;
  await save('tournaments',ctx.id||uid('t'),data);
  closeSheet(); toast(t?'Tournament saved':'Tournament created');
}
async function deleteTour(id){ for(const m of S.matches.filter(x=>x.tournamentId===id)) await patch('matches',m.id,{tournamentId:null,updatedAt:Date.now()}); await remove('tournaments',id); if(S.tourOpen===id) S.tourOpen=null; closeSheet(); toast('Tournament deleted: its matches stay in the log'); }

/* plan */
function openPlan(deckId,arch){
  const d=deckById(deckId); if(!d){ toast('Deck not found.','err'); return; }
  const p=arch?planFor(deckId,arch):null;
  const html=`<form id="plan-form" novalidate>
    ${sheetHead(p?'Sideboard plan':'New sideboard plan')}
    <p class="muted">${pips(d.colors)} ${esc(d.name)}</p>
    <div class="field"><label for="pf-arch">Against</label><input type="text" id="pf-arch" list="arch-list2" value="${esc(arch||'')}" placeholder="Opponent archetype" autocomplete="off"${arch?' readonly':''}></div>
    <datalist id="arch-list2">${archetypeNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
    <div class="row2">
      <div class="field"><label for="pf-in">In<span class="count" id="pf-in-n"></span></label><textarea id="pf-in" rows="7" spellcheck="false" placeholder="2 Pyroclasm">${esc(p?p.in:'')}</textarea></div>
      <div class="field"><label for="pf-out">Out<span class="count" id="pf-out-n"></span></label><textarea id="pf-out" rows="7" spellcheck="false" placeholder="2 Cabal Therapy">${esc(p?p.out:'')}</textarea></div>
    </div>
    <p class="warn" id="pf-warn" hidden></p>
    ${artHTML(p&&p.art?p.art:archArt(arch),'Archetype image')}
    <div class="field"><label for="pf-notes">Matchup notes</label><textarea id="pf-notes" class="prose" rows="4" placeholder="Who’s the beatdown, what to keep, play vs draw differences…">${esc(p?p.notes:'')}</textarea></div>
    ${d.side?`<details class="sidepeek"><summary>Show the deck’s sideboard</summary><pre>${esc(d.side)}</pre></details>`:''}
    ${actions(p?`<button type="button" class="btn danger" data-act="delete-plan" data-id="${esc(p.id)}" data-confirm data-confirm-label="Confirm delete">Delete</button>`:'')}
  </form>`;
  openSheet(html,{kind:'plan',deckId,p,art:p&&p.art?p.art:archArt(arch)});
  updateCounts();
}
async function savePlan(){
  const ctx=sheetCtx, arch=$('#pf-arch').value.trim(); if(!arch) return formErr('Enter which archetype the plan is for.');
  const p=ctx.p||planFor(ctx.deckId,arch), now=Date.now();
  const data={deckId:ctx.deckId,archetype:arch,in:norm($('#pf-in').value),out:norm($('#pf-out').value),notes:$('#pf-notes').value.trim(),art:artValue(),createdAt:p?(p.createdAt||now):now,updatedAt:now};
  if(p&&p.example) data.example=true;
  await save('plans',p?p.id:ctx.deckId+'__'+slug(arch),data);
  closeSheet(); toast('Plan saved');
}
function updateCounts(){
  [['df-main','df-main-n'],['df-side','df-side-n'],['pf-in','pf-in-n'],['pf-out','pf-out-n']].forEach(([a,b])=>{ const ta=document.getElementById(a), out=document.getElementById(b); if(ta&&out) out.textContent=' · '+cards(parseList(ta.value).total); });
  const w=$('#pf-warn'); if(w){ const i=parseList($('#pf-in').value).total, o=parseList($('#pf-out').value).total; w.hidden=i===o; w.textContent=`${cards(i)} in and ${cards(o)} out: the deck size would change.`; }
}

/* ---------- toasts ---------- */
function toast(msg,kind){ const el=document.createElement('div'); el.className='toast'+(kind==='err'?' err':''); el.textContent=msg; $('#toasts').appendChild(el); setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),300); },kind==='err'?5000:2400); }

/* ---------- actions ---------- */
function arm(btn){ btn.dataset.armed='1'; btn.dataset.label=btn.textContent; btn.textContent=btn.dataset.confirmLabel||'Confirm'; clearTimeout(btn._t); btn._t=setTimeout(()=>{ if(btn.isConnected&&btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=btn.dataset.label; } },4000); }
async function deleteExamples(){ let n=0; for(const c of ['matches','leagues','tournaments','plans','decks']){ for(const x of S[c].filter(y=>y.example)){ await remove(c,x.id); n++; } } toast(plural(n,'sample item deleted','sample items deleted')); }
async function deleteLeague(id){ for(const m of S.matches.filter(x=>x.leagueId===id)) await patch('matches',m.id,{leagueId:null,updatedAt:Date.now()}); await remove('leagues',id); if(S.leagueOpen===id) S.leagueOpen=null; toast('League deleted: its matches stay in the log'); }
async function exportBackup(){
  if(!S.dl){ toast('Export isn’t available in this view.','err'); return; }
  const out={app:'MTG Match Log',version:1,exportedAt:new Date().toISOString(),collections:{}};
  COLS.forEach(c=>{ const o={}; S[c].forEach(d=>{ const copy=Object.assign({},d); delete copy.id; o[d.id]=copy; }); out.collections[c]=o; });
  try{ await S.dl.save({filename:'mtg-files-backup-'+today()+'.json',data:JSON.stringify(out,null,2)}); if(S.db&&S.db.markExported) S.db.markExported(); toast('Backup saved'); scheduleRender(); }
  catch(e){ const c=e&&e.code; if(c==='declined') return; toast(c==='rate_limited'?'A save prompt is already open.':'Couldn’t export: try again.','err'); }
}
/* Import a backup file made by Export backup (here or on claude.ai). */
let pendingImport=null;
function pickImport(){ const inp=$('#import-file'); inp.value=''; inp.click(); }
async function readImport(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const bad=()=>toast('That file isn’t a backup from this app.','err');
  let obj; try{ obj=JSON.parse(await f.text()); }catch(e){ bad(); return; }
  const cols=obj&&obj.collections;
  const isMap=v=>v&&typeof v==='object'&&!Array.isArray(v);
  if(!isMap(cols)||!COLS.some(c=>isMap(cols[c]))){ bad(); return; }
  const clean={}; COLS.forEach(c=>{ const src=isMap(cols[c])?cols[c]:{}, o={}; Object.keys(src).forEach(id=>{ if(id&&isMap(src[id])){ const copy=Object.assign({},src[id]); delete copy.id; o[id]=copy; } }); clean[c]=o; });
  if(!COLS.some(c=>S[c].length)){ await applyImport(clean,'replace'); return; }
  pendingImport={clean,at:obj.exportedAt};
  const n=c=>Object.keys(clean[c]).length, at=Date.parse(obj.exportedAt||'');
  const rows=[['matches','Matches'],['leagues','Leagues'],['tournaments','Tournaments'],['decks','Decks'],['plans','Sideboard plans']];
  openSheet(`<form id="import-form" novalidate>
    ${sheetHead('Import backup')}
    ${at?`<p class="hint">Backup made on ${esc(fmtStamp(at))}.</p>`:''}
    <div class="tbl-wrap"><table><thead><tr><th><span class="sr">Data</span></th><th class="num">In the file</th><th class="num">On this device</th></tr></thead><tbody>${rows.map(([c,l])=>`<tr><td>${l}</td><td class="num">${n(c)}</td><td class="num">${S[c].length}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint"><strong>Add &amp; update</strong> keeps everything on this device and adds or updates what’s in the file. <strong>Replace everything</strong> makes this device an exact copy of the backup: anything not in the file is deleted.</p>
    <p class="form-err" id="form-err" hidden></p>
    <div class="sheet-actions"><button type="button" class="btn danger" data-act="import-replace" data-confirm data-confirm-label="Confirm: replace">Replace everything</button><span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-act="import-merge">Add &amp; update</button></div>
  </form>`,{kind:'import'});
}
async function applyImport(clean,mode){
  await need().importAll(clean,mode==='replace');
  pendingImport=null; if(!sheet.hidden) closeSheet();
  const n=Object.keys(clean.matches).length;
  toast((mode==='replace'?'Backup restored: ':'Backup added: ')+plural(n,'match','matches'));
}
async function deleteDeck(id){ for(const p of S.plans.filter(x=>x.deckId===id)) await remove('plans',p.id); await remove('decks',id); if(S.f.deck===id) S.f.deck='all'; closeSheet(); toast('Deck deleted: the matches played stay'); }

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.hasAttribute('data-confirm')&&!t.dataset.armed){ e.preventDefault(); arm(t); return; }
  const act=t.dataset.act, id=t.dataset.id;
  try{
    switch(act){
      case 'close': closeSheet(); break;
      case 'new-match': openMatch(null); break;
      case 'edit-match': openMatch(id); break;
      case 'new-match-league': { const l=leagueById(id); if(l) openMatch(null,{leagueId:l.id,deckId:l.deckId,format:l.format}); break; }
      case 'g-res': case 'g-play': {
        const i=+t.dataset.i, v=t.dataset.v, games=sheetCtx.F.games, g=games[i];
        if(act==='g-res'){ g.r=g.r===v?null:v; const nx=games[i+1]; if(nx&&(nx.play===null||nx.auto)){ if(g.r==='W'||g.r==='L'){ nx.play=g.r==='L'; nx.auto=true; } else if(nx.auto){ nx.play=null; nx.auto=false; } } }
        else { const val=v==='play'; g.play=g.play===val?null:val; g.auto=false; }
        renderGames(); const b=$(`#mf-games [data-act="${act}"][data-i="${i}"][data-v="${v}"]`); if(b) b.focus(); break; }
      case 'delete-match': await remove('matches',id); closeSheet(); toast('Match deleted'); break;
      case 'new-deck': openDeck(null); break;
      case 'edit-deck': openDeck(id); break;
      case 'color': { const c=t.dataset.v, list=sheetCtx.colors, ix=list.indexOf(c); if(ix>=0) list.splice(ix,1); else list.push(c); t.setAttribute('aria-pressed',String(ix<0)); break; }
      case 'restore-version': { const d=sheetCtx&&sheetCtx.d, v=d&&d.versions&&d.versions[+t.dataset.i]; if(v){ $('#df-main').value=v.main||''; $('#df-side').value=v.side||''; updateCounts(); $('#df-main').scrollIntoView({block:'center'}); toast('Version put back in the fields: press Save to keep it'); } break; }
      case 'delete-deck': await deleteDeck(id); break;
      case 'toggle-archived': S.showArchived=!S.showArchived; render(); break;
      case 'goto-sb': S.sbDeck=id; location.hash='sideboard'; break;
      case 'new-league': openLeague(); break;
      case 'drop-league': await patch('leagues',id,{status:'dropped',updatedAt:Date.now()}); toast('Drop recorded'); break;
      case 'undrop-league': await patch('leagues',id,{status:'active',updatedAt:Date.now()}); toast('League reopened'); break;
      case 'delete-league': await deleteLeague(id); break;
      case 'toggle-league': S.leagueOpen=S.leagueOpen===id?null:id; render(); break;
      case 'new-tour': openTour(null); break;
      case 'edit-tour': openTour(id); break;
      case 'delete-tour': await deleteTour(id); break;
      case 'toggle-tour': S.tourOpen=S.tourOpen===id?null:id; render(); break;
      case 'new-match-tour': { const tt=tourById(id); if(tt) openMatch(null,{tournamentId:tt.id,deckId:tt.deckId,format:tt.format,date:tt.date}); break; }
      case 'edit-plan': openPlan(t.dataset.deck,t.dataset.arch||''); break;
      case 'sb-open': openPlanView(t.dataset.deck,t.dataset.arch||''); break;
      case 'new-plan': if(S.sbCur&&deckById(S.sbCur)) openPlan(S.sbCur,''); else openDeck(null); break;
      case 'sb-export': openSbExport(t.dataset.deck); break;
      case 'sbx-print': window.print(); break;
      case 'sbx-share': await shareSbExport(); break;
      case 'art-search': await artSearch(); break;
      case 'art-pick': { const a=sheetCtx&&sheetCtx.artList&&sheetCtx.artList[+t.dataset.i]; if(a){ sheetCtx.art=a; const u=$('#art-url'); if(u) u.value=''; artCur(); document.querySelectorAll('.art-opt').forEach(b=>b.classList.toggle('on',b===t)); } break; }
      case 'art-clear': sheetCtx.art=null; { const u=$('#art-url'); if(u) u.value=''; } artCur(); break;
      case 'delete-plan': await remove('plans',id); closeSheet(); toast('Plan deleted'); break;
      case 'clear-filters': S.f={format:'all',deck:'all',period:'all',opp:'all'}; render(); break;
      case 'more': S.listLimit+=100; render(); break;
      case 'more-leagues': S.lgAll=!S.lgAll; render(); break;
      case 'arch-all': S.archAll=!S.archAll; render(); break;
      case 'del-examples': await deleteExamples(); break;
      case 'export': await exportBackup(); break;
      case 'import': pickImport(); break;
      case 'import-merge': if(pendingImport) await applyImport(pendingImport.clean,'merge'); break;
      case 'import-replace': if(pendingImport) await applyImport(pendingImport.clean,'replace'); break;
    }
  }catch(err){ if(sheetCtx&&$('#form-err')) formErr(errMsg(err)); else toast(errMsg(err),'err'); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.filter){ S.f[t.dataset.filter]=t.value; S.listLimit=100; render(); return; }
  switch(t.id){
    case 'sb-deck': S.sbDeck=t.value; render(); break;
    case 'mf-opp-sel': { $('#mf-opp').hidden=t.value!=='__new'; if(t.value==='__new') $('#mf-opp').focus(); break; }
    case 'mf-deck': { $('#mf-newdeck').hidden=t.value!=='__new'; if(t.value==='__new') $('#mf-newdeck').focus(); const d=deckById(t.value); if(d&&d.format&&!sheetCtx.m) $('#mf-format').value=d.format; syncLeagueField(); break; }
    case 'mf-event': syncLeagueField(); break;
    case 'mf-tour': $('#mf-newtour').hidden=t.value!=='__new'; if(t.value==='__new') $('#mf-newtour').focus(); break;
    case 'lf-deck': { const d=deckById(t.value); if(d&&d.format) $('#lf-format').value=d.format; break; }
    case 'tf-deck': { const d=deckById(t.value); if(d&&d.format) $('#tf-format').value=d.format; break; }
    case 'import-file': readImport(t).catch(err=>toast(errMsg(err),'err')); break;
  }
});
document.addEventListener('input',e=>{ if(['df-main','df-side','pf-in','pf-out'].includes(e.target.id)) updateCounts(); });
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target, fn={'match-form':saveMatch,'deck-form':saveDeck,'league-form':saveLeague,'tour-form':saveTour,'plan-form':savePlan}[f.id]; if(!fn) return;
  const btn=f.querySelector('button[type=submit]'); if(btn&&btn.disabled) return;
  const err=$('#form-err'); if(err) err.hidden=true;
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{ await fn(); }catch(x){ formErr(errMsg(x)); }
  finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent='Save'; } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) closeSheet(); if(e.key==='Enter'&&e.target&&e.target.id==='art-q'){ e.preventDefault(); artSearch(); } });
backdrop.addEventListener('click',closeSheet);

/* ---------- routing + boot ---------- */
function readHash(){ const h=(location.hash||'').slice(1); S.view=VIEWS.includes(h)?h:'summary'; }
window.addEventListener('hashchange',()=>{ readHash(); render(); window.scrollTo(0,0); });
readHash(); render();

function subscribe(col){
  S.db.collection(col).onSnapshot(snap=>{
    S[col]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    if(!snap.metadata.fromCache) S.got[col]=true;
    S.any=true;
    if(COLS.every(c=>S.got[c])){ clearTimeout(slowTimer); S.slow=false; }
    scheduleRender();
  },err=>{ S.err=err; S.got[col]=true; S.any=true; clearTimeout(slowTimer); scheduleRender(); });
}
(async function boot(){
  let db=null;
  try{ db=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null; }catch(e){ db=null; }
  if(!db){ S.status='nodb'; render(); return; }
  S.db=db; S.status='ready';
  slowTimer=setTimeout(()=>{ if(!COLS.every(c=>S.got[c])){ S.slow=true; if(!S.any) S.any=true; render(); } },10000);
  COLS.forEach(subscribe);
  try{ const dl=await window.claude.use('downloads'); if(dl){ S.dl=dl; scheduleRender(); } }catch(e){}
  try{ const user=await window.claude.use('user'); if(user){ const own=await user.isOwner(); if(own===false){ S.notOwner=true; scheduleRender(); } } }catch(e){}
})();
})();
</script>
